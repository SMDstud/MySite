<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Volpe che Saluta</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Animazione per la zampa che saluta */
        @keyframes wave-animation {
            0% { transform: rotate(0deg); }
            15% { transform: rotate(35deg); }
            30% { transform: rotate(-15deg); }
            45% { transform: rotate(35deg); }
            60% { transform: rotate(-15deg); }
            75% { transform: rotate(35deg); }
            100% { transform: rotate(0deg); }
        }

        /* Animazione per l'ingresso del fumetto */
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Animazione leggera per la coda */
        @keyframes wag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(4deg); }
        }

        #waving-arm {
            transform-origin: 190px 200px; /* Il fulcro è la spalla della volpe */
            animation: wave-animation 2.5s infinite ease-in-out;
        }

        #tail {
            transform-origin: 95px 260px;
            animation: wag 3s infinite ease-in-out;
        }

        .speech-bubble {
            animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            animation-delay: 0.3s;
        }

        /* Triangolino del fumetto */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
